name: eMudhra CA check (one-time)

# Temporary: remove this workflow and scripts/check_emudhra.py once the
# eMudhra CA incident (2026-10-21) is closed.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/emudhra-check.yml
      - scripts/check_emudhra.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image without cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          no-cache: true
          tags: ca-check:local

      - name: Test against the eMudhra test hosts
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/scripts:/chk:ro" ca-check:local /chk/check_emudhra.py
